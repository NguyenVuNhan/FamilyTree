name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Intentionally a single "pages" group (not scoped per-ref/run): GitHub's Pages
  # deployments must be serialized project-wide, so this is the recommended pattern
  # even though it also serializes unrelated CI runs. Do not scope this per-branch.
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      # Exported AFTER test:e2e so the hermetic :5173/:5174 e2e servers (see
      # playwright.config.ts / vite.config.ts) never see real FAMILY_TREE_* repo
      # variables — only the production build below should observe them.
      - name: Export FAMILY_TREE_* repo variables
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "$VARS_JSON" | jq -r 'to_entries[] | select(.key | startswith("FAMILY_TREE_")) | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # First-deploy enablement: turns on Pages (source: GitHub Actions) if it isn't
      # already, so a brand-new repo doesn't need a manual dashboard step first.
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
